const CBC={
PP:["Language","Math Activities","Environmental","Creative"],
G1_3:["English","Kiswahili","Mathematics","Environmental","Creative Arts","Religious Education"],
G4_6:["English","Kiswahili","Mathematics","Science & Tech","Social Studies","Agriculture","Religious Education"],

function getCbcGrade(mark){
  mark = Number(mark);

  if(mark >= 90) {
    return { level:"EE1", performance:"Exceeding Expectation", points:4.0 };
  }

  if(mark >= 75) {
    return { level:"EE2", performance:"Exceeding Expectation", points:3.5 };
  }

  if(mark >= 58) {
    return { level:"ME1", performance:"Meeting Expectation", points:3.0 };
  }

  if(mark >= 41) {
    return { level:"ME2", performance:"Meeting Expectation", points:2.5 };
  }

  if(mark >= 31) {
    return { level:"AE1", performance:"Approaching Expectation", points:2.0 };
  }

  if(mark >= 21) {
    return { level:"AE2", performance:"Approaching Expectation", points:1.5 };
  }

  if(mark >= 11) {
    return { level:"BE1", performance:"Below Expectation", points:1.0 };
  }

  return { level:"BE2", performance:"Below Expectation", points:0.5 };
}

function group(cls){
if(cls==="PP1"||cls==="PP2") return "PP";
if(cls.includes("Grade 1")||cls.includes("Grade 2")||cls.includes("Grade 3")) return "G1_3";
if(cls.includes("Grade 4")||cls.includes("Grade 5")||cls.includes("Grade 6")) return "G4_6";
return "G7_9";
}

}

  snap.forEach(docSnap=>{

    studentSelect.innerHTML += `

  });
}

let classChartInstance = null;

async function drawClassSummary(cls){

  try {

    const year = document.getElementById("resultsYearSelect").value;
    const term = document.getElementById("resultsTermSelect").value;

    const statsDiv = document.getElementById("classStats");
    const bestSubjectEl = document.getElementById("bestSubject");
    const bestStudentEl = document.getElementById("bestStudent");

    statsDiv.innerHTML = "";
    bestSubjectEl.innerHTML = "";
    bestStudentEl.innerHTML = "";

    const q = query(
      collection(db,"results"),
      where("class","==",cls),
      where("year","==",year),
      where("term","==",term),
      where("status","==","APPROVED")
    );

    const snap = await getDocs(q);

    if(snap.empty){
      statsDiv.innerHTML = "<p>No approved results.</p>";
      return;
    }

    const subjectTotals = {};
    const subjectCounts = {};
    const studentTotals = {};
    const studentCounts = {};

    snap.forEach(docSnap=>{
      const r = docSnap.data();

      r.subjects.forEach(s=>{
        if(!subjectTotals[s.subject]){
          subjectTotals[s.subject] = 0;
          subjectCounts[s.subject] = 0;
        }

        subjectTotals[s.subject] += s.marks;
        subjectCounts[s.subject] += 1;

        if(!studentTotals[r.student]){
          studentTotals[r.student] = 0;
          studentCounts[r.student] = 0;
        }

        studentTotals[r.student] += s.marks;
        studentCounts[r.student] += 1;
      });
    });

    let bestSub = "";
    let bestSubAvg = 0;

    const labels = [];
    const averages = [];

    for(const sub in subjectTotals){
      const avg = Math.round(subjectTotals[sub] / subjectCounts[sub]);

      labels.push(sub);
      averages.push(avg);

      const grade = getCbcGrade(avg);

      statsDiv.innerHTML += `
        <p><strong>${sub}</strong>: ${avg}% | ${grade.level} | ${grade.performance}</p>
      `;

      if(avg > bestSubAvg){
        bestSubAvg = avg;
        bestSub = sub;
      }
    }

    let bestStu = "";
    let bestStuAvg = 0;
    let classTotal = 0;
    let classCount = 0;

    for(const stu in studentTotals){
      const avg = Math.round(studentTotals[stu] / studentCounts[stu]);

      classTotal += studentTotals[stu];
      classCount += studentCounts[stu];

      if(avg > bestStuAvg){
        bestStuAvg = avg;
        bestStu = stu;
      }
    }

    const classAvg = Math.round(classTotal / classCount);
    const classGrade = getCbcGrade(classAvg);

    statsDiv.innerHTML += `
      <hr>
      <p><strong>Overall Class Average:</strong> ${classAvg}%</p>
      <p><strong>Overall Performance:</strong> ${classGrade.performance}</p>
    `;

    bestSubjectEl.innerHTML = `
      <div class="summary-box">
        🏆 <strong>Best Subject:</strong> ${bestSub} (${bestSubAvg}%)
      </div>
    `;

    bestStudentEl.innerHTML = `
      <div class="summary-box">
        👩‍🎓 <strong>Best Student:</strong> ${bestStu} (${bestStuAvg}%)
      </div>
    `;

    if(classChartInstance){
      classChartInstance.data.labels = labels;
      classChartInstance.data.datasets[0].data = averages;
      classChartInstance.update();
      return;
    }

    classChartInstance = new Chart(
      document.getElementById("classChart").getContext("2d"),
      {
        type: "bar",
        data: {
          labels,
          datasets: [{
            label: "Class Subject Averages (%)",
            data: averages
          }]
        },
        options: {
          responsive: true,
          scales: {
            y: { beginAtZero: true, max: 100 }
          }
        }
      }
    );

  } catch(err) {
    console.error("Class summary error:", err);
  }

}

// ===== GET ADMISSION NUMBER (TOP-LEVEL) =====
async function getAdmissionNumber(studentName, cls){
  const q = query(
    collection(db,"students"),
    where("name","==",studentName),
    where("class","==",cls)
  );

  const snap = await getDocs(q);
  if(snap.empty) return "";

  return snap.docs[0].data().admissionNo || "";
}

    collection(db,"students"),

  if(snap.empty) return "";

  return snap.docs[0].data().phone || "";
}
